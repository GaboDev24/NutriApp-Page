<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil del Paciente - NutriApp Pro</title>
    <link rel="stylesheet" href="css/style.css">

</head>

<body>
    <header class="scrolled">
        <div class="container">
            <nav>
                <div class="logo">NutriApp Pro</div>
                <div class="menu-toggle" id="menu-toggle">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <div class="nav-links" id="nav-links">
                    <a href="pro-dashboard.html" class="btn btn-outline" style="margin-right: 1rem;">Volver</a>
                    <button id="logoutBtn" class="btn btn-outline" style="border-color: #ef4444; color: #ef4444;">Cerrar
                        Sesión</button>
                </div>
            </nav>
        </div>
    </header>

    <div class="profile-container">
        <!-- Left Column: Patient Info & Chat -->
        <aside>
            <div class="card">
                <h3>Información del Paciente</h3>
                <div id="patientInfo">
                    <p>Cargando...</p>
                </div>
            </div>

            <div class="card">
                <h3>Mensajes</h3>
                <div id="chatBox" class="chat-box">
                    <!-- Messages will appear here -->
                </div>
                <form id="chatForm" class="chat-input">
                    <input type="text" id="messageInput" placeholder="Escribe un mensaje..." required>
                    <button type="submit" class="btn btn-primary">Enviar</button>
                </form>
            </div>
        </aside>

        <!-- Right Column: Routine Management -->
        <main>
            <div id="notification" class="notification"></div>
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                    <h3>Rutina Alimentaria</h3>
                    <button onclick="addMeal()" class="btn btn-outline">+ Agregar Comida</button>
                </div>

                <form id="routineForm">
                    <div id="mealsContainer">
                        <!-- Meal entries will be added here -->
                    </div>

                    <div style="margin-top: 1rem;">
                        <label>Recomendaciones Generales</label>
                        <textarea id="recommendations" rows="4"
                            style="width: 100%; border: 1px solid #e2e8f0; border-radius: 0.5rem; padding: 0.5rem;"></textarea>
                    </div>

                    <div style="margin-top: 1rem; text-align: right;">
                        <button type="submit" class="btn btn-primary">Guardar Rutina</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="js/patient-profile.js"></script>
    <script>
        const menuToggle = document.getElementById('menu-toggle');
        const navLinks = document.getElementById('nav-links');

        menuToggle.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });
    </script>
</body>

</html>
