<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriApp - Únete</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="auth-wrapper">
        <div class="auth-card glass">
            <div class="auth-header">
                <h2>Crea tu cuenta</h2>
                <p>Comienza tu viaje hacia el bienestar en NutriApp</p>
            </div>

            <div id="notification" class="notification"></div>

            <form id="signupForm">
                <div class="form-group">
                    <label for="name">Nombre Completo</label>
                    <input type="text" id="name" class="form-input" placeholder="Tu nombre completo" required>
                </div>
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" class="form-input" placeholder="correo@ejemplo.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirmar Contraseña</label>
                    <input type="password" id="confirmPassword" class="form-input" placeholder="••••••••" required>
                </div>
                <div class="form-group">
                    <label for="role">Tipo de Cuenta</label>
                    <select id="role" class="form-input" required>
                        <option value="user">Paciente (Busco asesoría nutricional)</option>
                        <option value="pro">Nutricionista (Soy profesional de la salud)</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Registrarme</button>
            </form>

            <div class="auth-footer">
                ¿Ya tienes cuenta? <a href="login.html">Inicia Sesión</a><br><br>
                <a href="resend-verification.html">¿No recibiste el correo de verificación?</a>
            </div>
        </div>
    </div>
    <script src="js/auth.js"></script>
</body>

</html>
