<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriApp - Únete</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="auth-wrapper">
        <div class="auth-card glass">
            <div class="auth-header">
                <h2>Crea tu cuenta</h2>
                <p>Comienza tu viaje hacia el bienestar</p>
            </div>
            <form id="signupForm">
                <div class="form-group">
                    <label>Nombre Completo</label>
                    <input type="text" id="name" class="form-input" placeholder="Tu nombre" required>
                </div>
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input type="email" id="email" class="form-input" placeholder="correo@ejemplo.com" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                </div>
                <div class="form-group">
                    <label>Confirmar Contraseña</label>
                    <input type="password" id="confirmPassword" class="form-input" placeholder="••••••••" required>
                </div>
                <div class="form-group">
                    <label>Soy un...</label>
                    <select id="role" class="form-input" required>
                        <option value="user">Usuario (Busco asesoría)</option>
                        <option value="pro">Profesional (Soy nutricionista)</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary"
                    style="width: 100%; margin-top: 1rem;">Registrarme</button>
            </form>
            <div class="auth-footer">
                ¿Ya tienes cuenta? <a href="login.html">Inicia Sesión</a><br><br>
                <a href="resend-verification.html">¿No recibiste el correo de verificación?</a>
            </div>
        </div>
    </div>
    <script src="js/auth.js"></script>
</body>

</html>
