<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriApp - Recuperar Contraseña</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="auth-wrapper">
        <div class="auth-card glass">
            <div class="auth-header">
                <h2>Recuperar Contraseña</h2>
                <p>Te enviaremos un enlace para restablecerla</p>
            </div>
            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input type="email" id="email" class="form-input" placeholder="correo@ejemplo.com" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Enviar
                    Enlace</button>
            </form>
            <div class="auth-footer">
                <a href="login.html">Volver al inicio de sesión</a>
            </div>
        </div>
    </div>
    <script src="js/auth.js"></script>
</body>

</html>
