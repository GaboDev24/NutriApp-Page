<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriApp - Panel Profesional</title>
    <link rel="stylesheet" href="css/style.css">

</head>

<body>
    <header class="scrolled">
        <div class="container">
            <nav>
                <div class="logo">NutriApp Pro</div>
                <div class="menu-toggle" id="sidebar-toggle">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <div id="userInfo">Hola, <span id="userName">Cargando...</span></div>
            </nav>
        </div>
    </header>

    <div class="container container-dashboard">
        <div class="sidebar-overlay" id="sidebar-overlay"></div>
        <div class="dashboard-grid">
            <aside class="sidebar">
                <ul style="list-style: none;">
                    <li style="margin-bottom: 1rem;"><a href="#" class="btn btn-primary" style="width: 100%;"
                            onclick="showSection('activePatients')">Mis
                            Pacientes</a></li>
                    <li style="margin-bottom: 1rem;"><a href="#" class="btn btn-outline" style="width: 100%;"
                            onclick="showSection('pendingRequests')">Solicitudes</a></li>
                    <li style="margin-bottom: 1rem;"><a href="#" class="btn btn-outline" style="width: 100%;"
                            onclick="showSection('profileSection')">Editar Perfil</a></li>
                    <li style="margin-top: 5rem;"><button id="logoutBtn" class="btn btn-outline"
                            style="width: 100%; border-color: #ef4444; color: #ef4444;">Cerrar Sesión</button></li>
                </ul>
            </aside>

            <main class="main-content">
                <div id="notification" class="notification"></div>

                <!-- Profile Edit Section -->
                <section id="profileSection" style="display: none;">
                    <h3>Editar Mi Perfil</h3>
                    <div class="card">
                        <form id="profileForm">
                            <div class="form-group">
                                <label>Nombre</label>
                                <input type="text" id="proName" class="form-input" required>
                            </div>
                            <div class="form-group">
                                <label>Especialización</label>
                                <input type="text" id="proSpecialization" class="form-input"
                                    placeholder="ej: Nutrición Deportiva">
                            </div>
                            <div class="form-group">
                                <label>Descripción Corta (se muestra en la página principal)</label>
                                <textarea id="proDescription" class="form-input" style="height: 80px;"
                                    placeholder="Descripción breve que verán los visitantes"></textarea>
                            </div>
                            <div class="form-group">
                                <label>Biografía Extendida</label>
                                <textarea id="proBio" class="form-input" style="height: 120px;"
                                    placeholder="Cuéntanos más sobre tu experiencia y enfoque"></textarea>
                            </div>
                            <div class="form-group">
                                <label>Años de Experiencia</label>
                                <input type="text" id="proExperience" class="form-input" placeholder="ej: 5 años">
                            </div>
                            <div class="form-group">
                                <label>Formación Académica</label>
                                <textarea id="proEducation" class="form-input" style="height: 80px;"
                                    placeholder="ej: Licenciado en Nutrición - Universidad XYZ"></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                            <button type="button" class="btn btn-outline"
                                onclick="showSection('activePatients')">Cancelar</button>
                        </form>
                    </div>
                </section>

                <section id="pendingRequests">
                    <h3>Solicitudes Pendientes</h3>
                    <div class="card">
                        <ul id="requestsList" class="patient-list">
                            <li>Cargando solicitudes...</li>
                        </ul>
                    </div>
                </section>

                <section id="activePatients">
                    <h3>Mis Pacientes</h3>
                    <div class="card">
                        <ul id="patientsList" class="patient-list">
                            <li>Cargando pacientes...</li>
                        </ul>
                    </div>
                </section>
            </main>
        </div>
    </div>
    <script src="js/pro-dashboard.js"></script>
    <script>
        const sidebarToggle = document.getElementById('sidebar-toggle');
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.getElementById('sidebar-overlay');

        if (sidebarToggle) {
            sidebarToggle.addEventListener('click', () => {
                sidebar.classList.toggle('active');
                overlay.classList.toggle('active');
            });

            overlay.addEventListener('click', () => {
                sidebar.classList.remove('active');
                overlay.classList.remove('active');
            });
        }
    </script>
</body>

</html>
