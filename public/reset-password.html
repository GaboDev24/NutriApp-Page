<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriApp - Restablecer Contraseña</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="auth-wrapper">
        <div class="auth-card glass">
            <div class="auth-header">
                <h2>Crea una nueva contraseña</h2>
                <p>Ingresa tu nueva contraseña debajo</p>
            </div>
            <div id="notification" class="notification"></div>
            <form id="resetPasswordForm">
                <div class="form-group">
                    <label>Nueva Contraseña</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                </div>
                <div class="form-group">
                    <label>Confirmar Contraseña</label>
                    <input type="password" id="confirmPassword" class="form-input" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Restablecer
                    Contraseña</button>
            </form>
        </div>
    </div>
    <script>
        const notification = document.getElementById('notification');

        function showNotification(message, type = 'success') {
            if (!notification) return;
            notification.textContent = message;
            notification.className = `notification ${type}`;
        }

        document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const password = e.target.password.value;
            const confirmPassword = e.target.confirmPassword.value;

            if (password !== confirmPassword) {
                showNotification('Las contraseñas no coinciden', 'error');
                return;
            }

            try {
                const response = await fetch(`/api/auth/reset-password/${token}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const result = await response.json();
                if (response.ok) {
                    showNotification(result.message, 'success');
                    setTimeout(() => window.location.href = 'login.html', 2000);
                } else {
                    showNotification(result.message, 'error');
                }
            } catch (err) {
                showNotification('Error al restablecer contraseña', 'error');
            }
        });
    </script>
</body>

</html>
