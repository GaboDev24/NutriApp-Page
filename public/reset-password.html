<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriApp | Restablecer contraseña</title>
    <meta name="description" content="Elige una nueva contraseña para volver a entrar a tu cuenta de NutriApp.">
    <link rel="stylesheet" href="css/site.css">
</head>

<body class="auth-body">
    <main class="auth">
        <aside class="auth-aside">
            <a href="index.html" class="brand" aria-label="NutriApp, volver al inicio">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z"></path>
                    <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"></path>
                </svg>
                NutriApp
            </a>
            <span class="auth-badge">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
                Actualización de Clave
            </span>
            <p class="auth-copy lead">Vuelve a tu plan y seguimiento con una nueva contraseña segura.</p>
            <figure class="auth-photo">
                <img src="assets/nutritionist.png" width="1024" height="1024" alt="Nutricionista con guardapolvo blanco y estetoscopio en una cocina luminosa" fetchpriority="high">
            </figure>
            <div class="auth-meta">
                <p class="auth-place">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                        <circle cx="12" cy="10" r="3"></circle>
                    </svg>
                    Mendoza, Argentina
                </p>
                <a href="index.html" class="auth-home">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    Volver al inicio
                </a>
            </div>
        </aside>

        <section class="auth-panel" aria-labelledby="auth-title">
            <div class="auth-card">
                <header class="auth-header">
                    <h1 id="auth-title">Crea una nueva contraseña</h1>
                    <p>Ingresa tu nueva clave de acceso debajo para actualizarla.</p>
                </header>

                <div id="notification" class="notification" role="status" aria-live="polite"></div>

                <form id="resetPasswordForm" novalidate>
                    <div class="field">
                        <label for="password">Nueva contraseña</label>
                        <div class="input-group">
                            <input type="password" id="password" name="password" class="input" placeholder="Mínimo 6 caracteres" autocomplete="new-password" required minlength="6">
                            <button type="button" class="password-toggle" aria-label="Mostrar contraseña">
                                <svg class="eye-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <svg class="eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                    <line x1="1" y1="1" x2="23" y2="23"></line>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="field">
                        <label for="confirmPassword">Confirmar contraseña</label>
                        <div class="input-group">
                            <input type="password" id="confirmPassword" name="confirmPassword" class="input" placeholder="Repite tu nueva contraseña" autocomplete="new-password" required>
                            <button type="button" class="password-toggle" aria-label="Mostrar contraseña">
                                <svg class="eye-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <svg class="eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                    <line x1="1" y1="1" x2="23" y2="23"></line>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary" id="resetSubmitBtn">Restablecer contraseña</button>
                </form>

                <div class="auth-footer">
                    <p><a href="login.html">Volver al inicio de sesión</a></p>
                    <p>¿No tienes cuenta? <a href="signup.html">Regístrate</a></p>
                </div>
            </div>
        </section>
    </main>

    <script>
        const notification = document.getElementById('notification');
        const resetForm = document.getElementById('resetPasswordForm');
        const submitBtn = document.getElementById('resetSubmitBtn');

        // Toggle password visibility
        document.querySelectorAll('.password-toggle').forEach(btn => {
            btn.addEventListener('click', () => {
                const input = btn.parentElement.querySelector('input');
                if (!input) return;
                const isPassword = input.type === 'password';
                input.type = isPassword ? 'text' : 'password';
                btn.setAttribute('aria-label', isPassword ? 'Ocultar contraseña' : 'Mostrar contraseña');
                btn.classList.toggle('is-visible', isPassword);
            });
        });

        function showNotification(message, type = 'success') {
            if (!notification) return;
            const iconSvg = type === 'success'
                ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>`
                : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>`;
            notification.innerHTML = `${iconSvg}<span>${message}</span>`;
            notification.className = `notification ${type}`;
        }

        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const password = resetForm.password.value;
            const confirmPassword = resetForm.confirmPassword.value;

            if (!password || password.length < 6) {
                showNotification('La contraseña debe tener al menos 6 caracteres.', 'error');
                return;
            }

            if (password !== confirmPassword) {
                showNotification('Las contraseñas no coinciden. Por favor verifícalas.', 'error');
                return;
            }

            if (!token) {
                showNotification('Token de recuperación no válido o inexistente en el enlace.', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.setAttribute('aria-busy', 'true');
            submitBtn.innerHTML = '<span class="btn-spinner" aria-hidden="true"></span> Restableciendo contraseña...';

            try {
                const response = await fetch(`/api/auth/reset-password/${token}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const result = await response.json();
                if (response.ok) {
                    showNotification(result.message || 'Contraseña restablecida con éxito. Redirigiendo...', 'success');
                    setTimeout(() => window.location.href = 'login.html', 2200);
                } else {
                    showNotification(result.message || 'Error al restablecer la contraseña.', 'error');
                    submitBtn.disabled = false;
                    submitBtn.removeAttribute('aria-busy');
                    submitBtn.textContent = 'Restablecer contraseña';
                }
            } catch (err) {
                showNotification('Error de conexión al restablecer contraseña.', 'error');
                submitBtn.disabled = false;
                submitBtn.removeAttribute('aria-busy');
                submitBtn.textContent = 'Restablecer contraseña';
            }
        });
    </script>
</body>

</html>
